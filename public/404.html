<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101110">
  <meta name="robots" content="noindex">
  <title>404 — Not found | Nightshift</title>
  <link rel="icon" type="image/png" href="/images/nightshift.png">
  <link rel="icon" type="image/svg+xml" href="/images/nightshift.svg">
  <link rel="icon" href="/images/nightshift.ico" sizes="any">
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root{color-scheme:dark;--bg:#101110;--line:#292d28;--text:#e9ece6;--muted:#777d75;--soft:#a1a69e;--lime:#b9f37c;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{background:#0c0d0c;color:var(--text);font-family:var(--font);font-size:14px;display:grid;place-items:center;overflow:auto}
    .error-page{width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 30%,#1b201b 0,#101110 62%)}
    .brand{display:flex;align-items:center;gap:9px;color:var(--text);font-size:15px;font-weight:700;letter-spacing:-.45px;text-decoration:none;margin-top:26px}
    .brand-mark{width:25px;height:25px;border-radius:8px;background:var(--lime);display:grid;place-items:center}
    .brand-mark svg{width:16px;height:16px;fill:#171a16}
    .brand-dot{color:var(--lime)}
    .hero{width:min(600px,calc(100% - 36px));padding-top:clamp(44px,8vh,86px);text-align:center}
    .eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;color:#a4aa9f;font:9px var(--mono);letter-spacing:.16em}
    .eyebrow-line{width:19px;height:1px;background:var(--lime)}
    .error-code{display:block;margin-top:22px;color:var(--lime);font:500 clamp(52px,12vw,110px) var(--mono);letter-spacing:-.08em;line-height:1;text-shadow:0 0 34px #b9f37c2a}
    h1{margin:18px 0 0;color:#f0f2ed;font-size:clamp(22px,4.4vw,34px);font-weight:600;letter-spacing:-.03em}
    .error-page p{margin:12px auto 0;max-width:44ch;color:#949a91;font-size:14px;line-height:1.75}
    .actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:30px;flex-wrap:wrap}
    .go-home{height:42px;padding:0 19px;border:0;border-radius:8px;background:var(--lime);color:#1a2114;display:inline-flex;align-items:center;gap:8px;font:600 12px var(--font);text-decoration:none;cursor:pointer;transition:background .18s}
    .go-home:hover{background:#cbffa0}
    .go-home svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .home-footer{width:min(600px,calc(100% - 36px));margin:auto auto 0;padding:15px 0 17px;border-top:1px solid #292d28;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#646b62;font:8px var(--mono);letter-spacing:.06em}
    .home-footer>span:first-child{display:flex;align-items:center;gap:8px}
    .footer-dot{width:5px;height:5px;border-radius:50%;background:var(--lime);box-shadow:0 0 9px #b9f37c88}
    .home-footer a{color:inherit;text-decoration:none}
    .home-footer a:hover{color:var(--lime)}
    @media(max-width:650px){.home-footer{justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <main class="error-page">
    <a class="brand" href="/" aria-label="Nightshift home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.7 2.4a9.6 9.6 0 1 0 5.9 16.8A11.1 11.1 0 0 1 15.7 2.4Z"/></svg></span>
      <span>nightshift<span class="brand-dot">.</span></span>
    </a>
    <div class="hero">
      <div class="eyebrow"><span class="eyebrow-line"></span>404 &middot; NOT FOUND<span class="eyebrow-line"></span></div>
      <span class="error-code" aria-hidden="true">404</span>
      <h1>This page went off the grid.</h1>
      <p>The page you're looking for was moved, renamed, or never existed. Check the address, then head back to the latest news from nowhere.</p>
      <div class="actions">
        <a class="go-home" href="/">Back to Nightshift<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
      </div>
    </div>
    <footer class="home-footer"><span><span class="footer-dot"></span> BROWSING, ON YOUR TERMS</span><span>POWERED BY SCRAMJET</span><span>CREATED BY <a href="https://github.com/palmtree890" target="_blank" rel="noopener noreferrer">PALMTREE890</a></span><span>SOURCE <a href="https://github.com/NightShift-Network/NightShift-source" target="_blank" rel="noopener noreferrer">GITHUB</a></span></footer>
  </main>
</body>
</html>
