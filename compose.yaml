services:
  nightshift:
    build: .
    image: nightshift:local
    container_name: nightshift
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      NIGHTSHIFT_PLUGINS_DIR: /app/plugins
    ports:
      - "127.0.0.1:${NIGHTSHIFT_PORT:-3005}:3000"
    volumes:
      - "../plugins:/app/plugins:ro"
